# Keeps the Supabase project from being paused.
#
# Supabase pauses free projects after roughly a week of inactivity. This lives
# in GitHub Actions rather than Vercel Cron on purpose: it is a Supabase
# concern, not an application one. Putting it in the app would couple a
# hosting workaround to the product and would stop working the moment someone
# deployed elsewhere. See docs/architecture.md ("Portability").
#
# Requires a repository secret named DATABASE_URL — the same pooler
# connection string the deployed app uses. Without it every run fails with
# "DATABASE_URL is not set".

name: Keep database awake

on:
  schedule:
    # Daily. Off the hour, because scheduled jobs queued at :00 are the most
    # likely to be delayed or dropped by GitHub under load.
    - cron: "23 6 * * *"
  # So the secret can be verified without waiting a day for the next run.
  workflow_dispatch:

# Read the repo, and file the failure issue below. Nothing else.
permissions:
  contents: read
  issues: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping the database
    runs-on: ubuntu-latest
    # A database that accepts the connection and then never answers would
    # otherwise sit here for six hours. Failing fast keeps the signal honest.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ping
        run: npm run db:keep-alive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # A red cross on a tab nobody opens is not visibility. GitHub emails
      # only whoever last edited the cron when a scheduled run fails, which is
      # exactly the notification people filter away. An open issue is a state
      # you trip over instead, and the two steps below keep it truthful: it
      # exists while the keep-alive is broken and closes itself when the next
      # run succeeds. Repeat failures comment rather than pile up new issues.
      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create keep-alive --color B60205 \
            --description "Automated: the database keep-alive is failing" --force
          existing=$(gh issue list --state open --label keep-alive --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Database keep-alive is failing" --label keep-alive \
              --body "$(printf '%s\n' \
                'The daily keep-alive could not query the database.' \
                '' \
                "Failing run: $RUN_URL" \
                '' \
                'Until this is fixed, Supabase will pause the project after about a week of inactivity and the site will return errors. Usual causes: the `DATABASE_URL` repository secret is missing or has been rotated, or the project is already paused and needs restoring from the Supabase dashboard.' \
                '' \
                'This issue closes itself on the next successful run.')"
          fi

      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --label keep-alive --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Keep-alive succeeded again; closing."
          fi

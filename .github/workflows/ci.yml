name: CI

# Both triggers are deliberate, and neither of them is *the* merge gate. That
# distinction is worth spelling out, because the obvious reading of this file
# is wrong in a way that stays invisible until the day it matters.
#
# The gate is the `protect main` repository ruleset. It requires two status
# checks by *context name* — `typecheck, lint, test, build` and `test:db
# against a real Postgres`, which are the two job `name:`s below — and GitHub
# matches those names against whatever check-runs exist on the head commit. It
# does not record which event produced a check-run. Both triggers run both
# jobs, so both produce both names, and **either run satisfies the gate on its
# own**: a green `push` run makes a commit mergeable even when the
# `pull_request` run never starts. The ruleset is the source of truth here, not
# this comment — docs/architecture.md#what-gates-a-merge sets out what it
# requires today and the command that re-reads it.
#
# So each trigger is kept for a reason that does not lean on the other:
#
#   `push` covers commits that never open a PR — a direct push to main cannot
#   quietly break the build — and covers a branch from its first commit rather
#   than from whenever a PR happens to be opened for it.
#
#   `pull_request` is the only run that tests the *merge result*: its checkout
#   resolves `refs/pull/N/merge`, the branch and the current main brought
#   together, rather than the branch tip the `push` run builds. Those are two
#   different trees reporting under one pair of names.
#
# That second reason is narrower than it first looks, and what narrows it is
# the ruleset again: `protect main` also requires a linear history and an
# up-to-date branch, so by the time a merge is permitted the branch is already
# rebased onto main and the merge ref carries the same tree as the tip. That is
# what makes a lone green `push` run an honest signal here rather than a lucky
# one. It is a property of the ruleset rather than of this file, which is one
# more reason to check the ruleset rather than trust this paragraph.
#
# The price of running both is duplication: a commit on a PR branch runs twice
# and produces **four** check-runs for two required contexts. Four is therefore
# the number to expect when reading check state on a PR head SHA, and fewer is
# a symptom rather than a rounding error — a run that never starts contributes
# no check-runs at all, so it goes missing rather than going red, and a summary
# that lists only what it can see reports the remainder as complete.
# docs/architecture.md#reading-ci-truthfully has the two commands that tell the
# difference.
#
# Two narrowings that look attractive from here, and are not taken:
#
#   Restricting `push` to `branches: [main]` would halve the runs and end the
#   two-runs-one-context-name ambiguity at its root. It is declined because it
#   also deletes the second half of the `push` reason above — a branch would go
#   unchecked until a PR existed for it — and duplicate runs on a free runner
#   are the cheaper of the two mistakes.
#
#   Requiring a context that only `pull_request` can produce would make the gate
#   mean what people assume it means. It is declined because it removes the
#   fallback: when the `pull_request` run wedges, the `push` run on the same
#   commit is what still reports. A PR-only required context turns one stuck run
#   into a merge freeze with no way through — which is the failure mode of
#   2026-08-26 restated, not a fix for it.
on:
  push:
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# Superseded runs of the *same* trigger on the same ref are pointless once a
# newer commit exists. Keying on `event_name` as well keeps the `push` and
# `pull_request` runs of one commit out of each other's group, so neither
# cancels the other's check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The collation this job runs under, stated rather than inherited
    # (`YEO-120`).
    #
    # Nothing here named `LANG` or `LC_ALL` until this ticket. That did not
    # mean the suite ran without a collation — it meant the collation was
    # whatever `ubuntu-latest` resolved to, so every locale-dependent
    # assertion in the repository was checked against one answer, forever, and
    # a fixture that quietly encodes an `en-US` answer passed.
    #
    # `YEO-116` is what that costs. Its own test asserted
    # `"Æsa".localeCompare("Zorro") < 0` with no locale named, in a pull
    # request whose entire subject was that an unpinned collation looks pinned
    # and is not. CI was green, because the runner resolves to `en-US`; under
    # `LC_ALL=sv_SE.UTF-8` the assertion is false. A second reviewer approved
    # that commit after running all 3156 tests green under their own default
    # locale, which is precisely what the bug predicts. The number of
    # approvals was not the signal, and CI could not have been one either.
    #
    # So the default is written down. `en_US.UTF-8` is not a neutral choice
    # and is not claimed to be one — it is the collation most contributors
    # develop under. Naming it is what turns the runs below into a comparison
    # against a stated baseline rather than against a property of the runner
    # image, and what makes a change to that baseline show up in a diff.
    #
    # Both variables are set because ICU consults `LC_ALL` first and falls
    # back to `LANG`; setting only one leaves the other as a way for a future
    # step to change the answer without appearing to.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v7

      # Next 16 requires Node >=20.9; this is developed on 22, so CI pins the
      # same major rather than drifting with whatever the runner image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is committed, and CI
      # should fail on a lockfile that disagrees with package.json instead of
      # silently resolving a different dependency tree than a developer has.
      - run: npm ci

      # First of the checks, because it is the cheapest possible signal:
      # `prettier --check` reads and re-prints source, nothing more, so it
      # returns well before `tsc` has to resolve a type graph or ESLint has to
      # walk the AST rule by rule. Same "fail fast, cheapest signal first"
      # reasoning `npm test` below documents for its own position ahead of the
      # build. Formatting drift is also the least informative failure a
      # developer can hit downstream — better to report it before spending the
      # runner's time on checks that assume the diff is at least well-formed.
      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run lint

      # Before the build, because it is far quicker to fail and a broken unit
      # test is a more useful first signal than a broken bundle. `npm test`
      # runs Vitest's `unit` project, which is the half of the suite that
      # needs no database — the same constraint the build step below is
      # documenting. Tests that do need Postgres are named `*.db.test.ts`; the
      # `database` job below runs those, against a Postgres of its own.
      # See docs/testing.md.
      - run: npm test

      # The same unit suite again, under collations that disagree with
      # `en_US` about the order of letters (`YEO-120`).
      #
      # ## Why extra steps rather than a matrix axis
      #
      # A matrix is the obvious shape and it is the one shape this job cannot
      # take. `protect main` requires a status check by the *context name*
      # `typecheck, lint, test, build`, which is this job's `name:` — and a
      # matrix renames every leg to `typecheck, lint, test, build (en_US.UTF-8)`
      # and so on. The required context would then match no check-run that
      # exists on any commit, and `main` would be unmergeable until somebody
      # with admin on the ruleset noticed. See
      # docs/architecture.md#the-ruleset-is-the-gate-not-the-workflow.
      #
      # A separate *job* would parallelise instead of serialising, and is
      # declined for the same reason turned around: a new job is a new context
      # name, and a context the ruleset does not require can go red without
      # blocking anything. Extra steps in this job gate a merge from the first
      # commit that runs them rather than from whenever the ruleset is next
      # edited — and closing the hole today is the whole point of the ticket.
      #
      # The wall clock does not argue for a job either. The unit suite is
      # about ten seconds, so both extra runs together cost less than `npm ci`
      # does.
      #
      # ## Why these two collations
      #
      # Because they are the two that have actually caught something, which is
      # a better reason than breadth.
      #
      # `sv_SE` alphabetises `Æ`, `Ä` and `Ö` after `Z`. That is the collation
      # that falsifies the `YEO-116` fixture described on the job above.
      #
      # `da_DK` does that *and* alphabetises `aa` as `å`, also at the end — so
      # "Aaron Rose" sorts after "Rosalind". `lib/partner-search.test.ts`
      # asserted the opposite, and was failing under Danish on `main` while CI
      # reported green.
      #
      # Neither run is expected to fail. They exist so that the next fixture
      # written to an `en-US` answer fails *somewhere*, instead of passing
      # everywhere and being wrong in the other two hundred locales.
      #
      # `test/collation-environment.test.ts` is what stops these from passing
      # vacuously: a `small-icu` Node resolves every locale to the root
      # collation, which would leave three runs testing one ordering while
      # looking like three. That file asserts what ICU actually resolved
      # rather than trusting that the variable took.
      #
      # ## The warning these two steps print, which is not a problem
      #
      # Each logs, before anything else:
      #
      #   bash: warning: setlocale: LC_ALL: cannot change locale (sv_SE.UTF-8)
      #
      # That is bash, not Node. The runner image ships only `C.UTF-8` and
      # `en_US.UTF-8` as *generated glibc* locales, so `setlocale(3)` refuses
      # the request and bash says so. It reads exactly like the locale failing
      # to take, and the obvious repairs — `locale-gen`, or giving up on the
      # second collation — are both answers to a problem that is not there.
      #
      # Node's ICU does not go through `setlocale`. It reads `LC_ALL` and
      # `LANG` from the environment itself and carries its own collation data,
      # so `new Intl.Collator()` resolves to `sv-SE` here regardless of what
      # glibc knows. The evidence is not this comment: it is that all three
      # tests in `test/collation-environment.test.ts` *run and pass* in these
      # steps, and the one asserting that the resolved locale is the one asked
      # for would fail if ICU had fallen back. If that assertion ever does go
      # red, the locale really has not taken and generating it is the fix.
      - name: Run the unit suite under Swedish collation
        run: npm test
        env:
          LANG: sv_SE.UTF-8
          LC_ALL: sv_SE.UTF-8

      - name: Run the unit suite under Danish collation
        run: npm test
        env:
          LANG: da_DK.UTF-8
          LC_ALL: da_DK.UTF-8

      # No DATABASE_URL, no AUTH_* — deliberately. `next build` evaluates every
      # module while it collects route data, so a build that needs a live
      # database is a defect that surfaces first in CI. db/index.ts connects
      # lazily behind a Proxy precisely so it does not, and running this step
      # with an empty environment is what keeps that true.
      - run: npm run build

  # The other half of the suite: `*.db.test.ts`, run against a real Postgres.
  #
  # ## Why this exists at all
  #
  # It did not, for a long time, and the cost was not the missing coverage. It
  # was that a suite nobody runs starts shaping the code written against it.
  # Two tickets in the E6/E7 work extracted pure-logic modules
  # (`lib/import-batches.ts`, `lib/import-rows.ts`) *specifically* so the
  # arithmetic would land in `npm test` and therefore in CI. Both extractions
  # are good code and both are staying, but the reason for them was routing
  # around this gap, and the next person could as easily route around it by
  # writing a weaker test instead of a better module. A suite that gates
  # nothing also hides real signal: the millisecond race in
  # `lib/save-page.db.test.ts` was a genuine flake that nobody had to care
  # about, because nothing it could go red on was watching. (It is fixed now —
  # turning the suite on is what made fixing it necessary.)
  #
  # ## Why a separate job rather than more steps in `check`
  #
  # Two reasons, and the second is the load-bearing one.
  #
  # Wall clock: a separate job runs concurrently with `check`, so the database
  # tests cost a PR no additional waiting at all — the run is as long as its
  # slowest job, and that is still `check` with its build.
  #
  # And `check` must stay bare. That job deliberately has no `DATABASE_URL`
  # and no `AUTH_*`, which is precisely what makes its `npm run build` step
  # prove that a build needs no live database. Putting a Postgres service on
  # that job would put a reachable database in the environment the build runs
  # in, and the guarantee would be gone — silently, since the build would go
  # on passing either way. The isolation is the point.
  database:
    name: test:db against a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # A disposable database per run, so these tests never share rows with
      # anything and start from a schema this commit's migrations produced.
      #
      # Pinned to a major rather than `latest`, matching backup.yml: a new
      # PostgreSQL release should not be able to change what a green tick
      # means overnight.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without a health check the steps below start racing the container's
        # own startup, which is the classic way a database job becomes
        # intermittently red for reasons that have nothing to do with the
        # commit.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # `TEST_DATABASE_URL` rather than `DATABASE_URL`, because that is the
    # variable the test scripts actually read: both `db:migrate:test` and
    # `test:db` set `DATABASE_TARGET=test`, and `lib/database-target.ts`
    # resolves that target to `TEST_DATABASE_URL`. Setting `DATABASE_URL` here
    # instead would leave the resolution failing with "DATABASE_TARGET=test
    # requires TEST_DATABASE_URL to be set". Naming it this way also means CI
    # runs the same two commands a developer runs locally, with the same
    # variable pointing somewhere else — nothing here is a CI-only code path.
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Stated for the same reason the `check` job states it (`YEO-120`): a
      # job that names no collation does not run without one, it runs under
      # whichever the runner image supplies, and that is a decision made by
      # nobody.
      #
      # This job is *not* run a second time under another collation, and that
      # is not an oversight. Ordering in `*.db.test.ts` is overwhelmingly
      # Postgres's, decided by the collation of the `postgres:17` service
      # container's database rather than by Node's ICU — so a second `LC_ALL`
      # here would re-run the suite without varying the thing that decides
      # the answers. What varies it is the container's own `LC_COLLATE`, and
      # changing that is a different ticket with a different argument to make:
      # the application's production database has one collation, and a suite
      # that ran against two would be asserting against an ordering no
      # deployment has. The collation this job *can* honestly pin is Node's,
      # so it pins it and stops there.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v7

      # Same Node major as the `check` job and as local development.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The service container comes up empty, so the schema has to be built
      # before anything queries it. This is `drizzle-kit`, the same command
      # docs/testing.md tells a developer to run against their own
      # `heirloom_test` — rather than `db:migrate:deploy`, which exists for a
      # different job (it takes `MIGRATE_DATABASE_URL`, for Supabase's session
      # pooler) and would need `DATABASE_URL` set directly, contradicting the
      # target resolution above.
      #
      # Running the migrations rather than `db:push`ing the schema means this
      # job also proves the migration files apply cleanly to an empty
      # database — the same thing a deploy does, checked on every PR instead
      # of first at merge.
      - name: Create the schema
        run: npm run db:migrate:test

      # Bounded on the step rather than only on the job, for the reason
      # keep-alive.yml spells out at length: a *job* timeout cancels the job,
      # and the failure then reads as "cancelled" rather than as a test
      # failure. This suite is ~9s locally and the files run one at a time
      # (`fileParallelism: false`, since they share the one database), so ten
      # minutes is far past stuck — it is a deadlock detector, not a budget.
      # If it ever starts being approached, that is the signal to split the
      # suite, not to raise the number.
      - name: Run the database tests
        timeout-minutes: 10
        run: npm run test:db
